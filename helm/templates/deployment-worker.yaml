apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "syncapp.fullname" . }}-worker
  labels:
    {{- include "syncapp.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "syncapp.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "syncapp.labels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "syncapp.serviceAccountName" . }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: {{ .Chart.Name }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}

          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - "celery"
            - "-A"
            - "syncapp"
            - "worker"
            - "-l"
            - "info"
            - "--concurrency=2"
            - "--statedb=/tmp/worker1.state"
          #   - "--prefetch-multiplier=4"
          #   - "--disable-prefetch"
          env:
          {{- range $key, $val := .Values.env }}
          - name: {{ $key }}
            value: {{ $val | quote }}
          {{- end }}            
{{- if .Values.postgres.enabled }}
          - name: POSTGRES_HOST
            value: {{ include "syncapp.fullname" . }}-postgres
{{- end }}
{{- if .Values.redis.enabled }}
          - name:  REDIS_HOST
            value: "{{ include "syncapp.fullname" . }}-redis"
          - name:  REDIS_PORT
            value: "{{ .Values.redis.service.port }}"
          - name:  CELERY_BROKER_URL
            value: "redis://{{ include "syncapp.fullname" . }}-redis:{{ .Values.redis.service.port }}/0"
          - name: CELERY_RESULT_BACKEND
            value: "redis://{{ include "syncapp.fullname" . }}-redis:{{ .Values.redis.service.port }}/0"
{{- end }}



          envFrom:
            - secretRef:
                name: {{ .Values.appsecret }}
          {{- with .Values.worker.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}



          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: run
              mountPath: /run
            - name: csync-logs
              mountPath: /var/log/app
          #
          #   - name: csync-static
          #     mountPath: /srv/syncapp/app/static
          #
            - name: csync-artifacts
              mountPath: /data/artifacts


      volumes:
        - name: tmp
          emptyDir: {}

        - name: run
          emptyDir: {}
        - name: csync-logs
          persistentVolumeClaim:
            claimName:  {{ include "syncapp.fullname" . }}-logs
        - name: csync-artifacts
          persistentVolumeClaim:
            claimName:  {{ include "syncapp.fullname" . }}-artifacts
        # - name: csync-static
        #   persistentVolumeClaim:
        #     claimName:  {{ include "syncapp.fullname" . }}-static

      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
