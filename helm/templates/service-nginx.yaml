apiVersion: v1
kind: Service
metadata:
  name: {{ include "syncapp.fullname" . }}-nginx
  labels:
    app: {{ include "syncapp.fullname" . }}-nginx
    {{- include "syncapp.labels" . | nindent 4 }}
spec:
  type: {{ .Values.nginx.service.type }}
  ports:

    - port: {{ .Values.nginx.service.port }}
      targetPort: nginx
      protocol: TCP
      name: nginx
  selector:
    app: {{ include "syncapp.fullname" . }}-nginx
    {{- include "syncapp.selectorLabels" . | nindent 4 }}
