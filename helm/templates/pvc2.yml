
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "syncapp.fullname" . }}-artifacts
#  namespace: sandbox
  annotations:
    "helm.sh/resource-policy": keep
spec:
  accessModes:
  - ReadWriteMany
  resources:
    requests:
      storage: 5G
  storageClassName: {{ .Values.storage.artifacts.storageClassName }}

status:
  accessModes:
  - ReadWriteMany
  capacity:
    storage: 5G
  phase: Bound

