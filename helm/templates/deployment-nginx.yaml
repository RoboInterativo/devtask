apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "syncapp.fullname" . }}-nginx
  labels:
    app: {{ include "syncapp.fullname" . }}-nginx
    {{- include "syncapp.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      app: {{ include "syncapp.fullname" . }}-nginx
      {{- include "syncapp.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        app: {{ include "syncapp.fullname" . }}-nginx
        {{- include "syncapp.labels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "syncapp.serviceAccountName" . }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: {{ .Chart.Name }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}

          image: "{{ .Values.nginx.image.repository }}:{{ .Values.nginx.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.nginx.image.pullPolicy }}
          # command:
          #   - "uwsgi"
          #   - "--ini"
          #   - "uwsgi.ini"

          ports:

            - name: nginx
              containerPort: {{ .Values.nginx.service.port }}
              protocol: TCP

          {{- with .Values.nginx.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.nginx.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.nginx.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}

          volumeMounts:
            - name: nginx-conf-file
              readOnly: true
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf

            - name: csync-static
              mountPath: /srv/syncapp/app/static




      volumes:
        - name: nginx-conf-file
          configMap:
            defaultMode: 420
            name: {{ include "syncapp.fullname" . }}-nginx
        - name: csync-static
          persistentVolumeClaim:
            claimName:  {{ include "syncapp.fullname" . }}-static

      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
