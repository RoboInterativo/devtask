apiVersion: v1
kind: Service
metadata:
  name: {{ include "syncapp.fullname" . }}
  labels:
    {{- include "syncapp.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: socket
      protocol: TCP
      name: socket
    - port: {{ .Values.service.port2 }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "syncapp.selectorLabels" . | nindent 4 }}
