server {
    listen 80;
    server_name _;
    
    location = /healthz {
        return 200 "ok\n";
    }
    location /static/ {
        alias /usr/share/nginx/static/;
    }

    location / {
        include uwsgi_params;
        uwsgi_pass {{ include "syncapp.fullname" . }}:{{ .Values.service.port }};
    }
}
