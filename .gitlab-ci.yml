variables:


    GIT_SUBMODULE_STRATEGY: recursive
    GIT_SUBMODULE_FORCE_HTTPS: "true"
    GIT_STRATEGY: clone
    GIT_DEPTH: 0

    DOCKER_AUTH_CONFIG: |
          {
          	"auths": {
          		"registry.robointerativo.org": {
          			"auth":  "${GITLAB}"
          		},
          		"docker-int.robointerativo.org": {
          			"auth":  "${NEXUS}"
          		},
          		"docker-proxy.robointerativo.org": {
          			"auth":  "${NEXUS}"
          		}
          	}
          }

