stages:
  - build
  - deploy

variables:


    GIT_SUBMODULE_STRATEGY: recursive
    GIT_SUBMODULE_FORCE_HTTPS: "true"
    GIT_STRATEGY: clone
    GIT_DEPTH: 0

    DOCKER_AUTH_CONFIG: |
          {
          	"auths": {
          		"docker-int.robointerativo.org": {
          			"auth":  "${NEXUS}"
          		},
          		"docker-proxy.robointerativo.org": {
          			"auth":  "${NEXUS}"
          		}
          	}
          }
build:
  #
  stage: build
  when: manual
  # rules:
  #   - changes:
  #       - backend/**/*
  image:
    name: gcr.io/kaniko-project/executor:v1.14.0-debug
    entrypoint: [""]
  before_script:
    - pwd
    - ls -li
    - chmod +x ./create.sh
    - pwd && ls
    - ./create.sh
    - cp config.json /kaniko/.docker
    - ls /kaniko/.docker

  script:
    - /kaniko/executor --help
    - /kaniko/executor
      --context "${CI_PROJECT_DIR}"
      --skip-tls-verify
      --skip-tls-verify-pull
      --dockerfile "${CI_PROJECT_DIR}/Dockerfile"
      --destination "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA"
        #$CI_COMMIT_SHORT_SHA"
    - echo $CI_COMMIT_SHORT_SHA



  tags:
    - dev

deploy:
  stage: deploy
  when: manual
  image:
    name: dtzar/helm-kubectl:3.14.3
  #  name: bitnami/kubectl:1.25.11
    #name:  docker-int.robointerativo.org/helm-kubectl:1

    #

  script:
    - "ls -li"
    - "pwd"
    # - "echo TOKEN $REG_TOKEN"
    - echo "TAG ${CI_COMMIT_REF_SLUG}"


    - chmod +x ./create.sh
    - ./create.sh

    - kubectl config get-contexts
    - pwd

    - ls -li

    - kubectl config use-context sandbox/agent_config:agent-sandbox
    - kubectl get pod -n sandbox
    - cd helm/ && helm upgrade --install sync -n sandbox -f values.yaml .


  tags:
    - dev



