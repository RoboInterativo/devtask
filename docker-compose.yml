version: "3.8"

services:
  db:
    image: postgres:14
    env_file: .env
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: always

  redis:
    image: redis:latest
    ports:
      - "6379:6379"
    restart: always

  web:
    build: .
    env_file: .env
    depends_on:
      - db
      - redis
    volumes:
      - ./app:/srv/syncapp/app
      # в проде ./logs - это NFS, примонтированный на хост
      - ./logs:/var/log/app
      - static_data:/srv/syncapp/app/static
      - artifacts:/data/artifacts
    restart: always

  worker:
    build: .
    command: celery -A syncapp worker -l info
    env_file: .env
    depends_on:
      - web
    volumes:
      - ./app:/srv/syncapp/app
      - ./logs:/var/log/app
      - artifacts:/data/artifacts
    restart: always

  beat:
    build: .
    command: celery -A syncapp beat -l info
    env_file: .env
    depends_on:
      - web
    volumes:
      - ./app:/srv/syncapp/app
      - ./logs:/var/log/app
    restart: always

  nginx:
    image: nginx:latest
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
      - static_data:/usr/share/nginx/static
    depends_on:
      - web
    restart: always

volumes:
  pgdata:
  static_data:
  artifacts:
